<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Client Account | Voyage Uganda</title>
  <meta name="theme-color" content="#1b5a39">
  <link rel="stylesheet" href="voyage-theme.css">
  <style>.err{color:#b3261e;font-size:.88rem;display:none;margin-top:.5rem}</style>
</head>
<body>
<div class="topbar"><div class="container">
  <span class="license">Create traveller account</span>
  <span><a href="client-login.html">Client login</a></span>
</div></div>
<header class="site-header"><div class="container">
  <a class="brand" href="index.html"><img src="logo.png" alt="" width="46" height="46" onerror="this.style.display='none'">
    <span class="brand-text"><span class="brand-name">voyage uganda</span><span class="brand-tag">Sign up</span></span></a>
  <nav class="nav"><a href="index.html">Home</a><a href="itineraries.html">Itineraries</a>
    <a class="btn btn-primary" href="client-login.html">Login</a></nav>
</div></header>
<main>
<section class="section"><div class="container" style="max-width:640px">
  <div class="section-head">
    <span class="eyebrow">Traveller account</span>
    <h2>Create your free account</h2>
    <div class="divider"></div>
  </div>
  <div class="form-card" style="margin-bottom:1rem">
    <button type="button" class="btn btn-outline-dark" id="google-signup" style="width:100%">Continue with Google</button>
  </div>
  <form class="form-card" id="reg">
    <div class="form-grid">
      <div class="field"><label>Full name *</label><input name="name" required autocomplete="name"></div>
      <div class="field"><label>Email *</label><input name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Password * (min 6)</label><input name="password" type="password" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label>Phone</label><input name="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label>Country</label><input name="country" autocomplete="country-name"></div>
      <div class="field full"><label>Travel interest</label>
        <select name="interest"><option value="">Select</option>
          <option>Gorilla trekking</option><option>Classic safari</option>
          <option>Multi-country</option><option>Family</option></select></div>
    </div>
    <p class="err" id="err"></p>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:1rem">Create account</button>
  </form>
</div></section>
</main>
<script type="module">
  import { registerEmail, loginGoogle, ensureUserProfile, watchAuth } from "./js/firebase-app.js";
  const redirect = new URLSearchParams(location.search).get("redirect") || "itineraries.html";
  watchAuth((u) => { if (u) location.replace(redirect); });
  function showErr(m){ const e=document.getElementById("err"); e.style.display="block"; e.textContent=m; }
  document.getElementById("google-signup").onclick = async () => {
    try {
      const cred = await loginGoogle();
      await ensureUserProfile(cred.user, { role: "client" });
      location.href = redirect;
    } catch (e) { showErr(e.message); }
  };
  document.getElementById("reg").onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    try {
      const cred = await registerEmail(f.email, f.password, f.name);
      await ensureUserProfile(cred.user, {
        role: "client", name: f.name, phone: f.phone || "", country: f.country || "", interest: f.interest || ""
      });
      location.href = redirect;
    } catch (err) { showErr(err.message); }
  };
</script>
</body>
</html>
